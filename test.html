<!doctype html>
<html lang="ru">
<head><meta charset="UTF-8"><title>Test Diagnostic</title>
<style>
:root {
  --bg-deep: #0a0a0e; --bg-panel: #111014; --text-primary: #e8e6e0;
  --text-secondary: #9a9890; --text-tertiary: #6a6860; --accent-blue: #c4a87c;
  --border-subtle: rgba(255,255,255,0.05); --border-mid: rgba(255,255,255,0.08);
  --radius-md: 12px; --radius-lg: 18px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg-deep); color:var(--text-primary); font-family:Manrope,Inter,sans-serif; height:100vh; display:flex; }
#panel-controllers { flex:1; background:var(--bg-panel); padding:16px; overflow-y:auto; }
#panel-output { width:300px; background:var(--bg-panel); border-left:1px solid var(--border-subtle); padding:16px; }
.quest-panel-header { font-size:10px; font-weight:600; letter-spacing:0.15em; color:var(--text-tertiary); margin-bottom:12px; text-transform:uppercase; }
.quest-next-btn { width:100%; padding:12px; background:var(--bg-panel); border:1px solid var(--border-mid); border-radius:8px; color:var(--text-primary); font-family:inherit; font-size:13px; cursor:pointer; margin-top:8px; }
.quest-right-card { border:1px solid; border-radius:var(--radius-md); padding:14px; margin-bottom:12px; }
.quest-right-archetype { font-size:18px; font-weight:500; }
.quest-right-sub { font-size:10px; color:var(--text-tertiary); margin-top:4px; }
.quest-right-section-title { font-size:9px; font-weight:600; letter-spacing:0.12em; color:var(--text-tertiary); margin:8px 0 4px; }
.quest-vector-row { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
.quest-vector-label { font-size:10px; color:var(--text-secondary); width:60px; }
.quest-vector-track { flex:1; height:3px; background:rgba(255,255,255,0.06); border-radius:2px; overflow:hidden; }
.quest-vector-fill { height:100%; border-radius:2px; }
.quest-vector-val { font-size:10px; color:var(--text-primary); width:26px; text-align:right; }
</style>
</head>
<body>
<div id="panel-controllers"></div>
<div id="panel-output"><div class="quest-panel-header">ВИЗУАЛИЗАЦИЯ</div></div>
<script src="diagnostic.js?v=test"></script>
</body>
</html>
